name: pipeline observability
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: install build dependencies
        run: |
          pip install build
      - name: Build Package
        run: |
          python -m build


      - name: Verify sha256 checksum
        run: |
          sha256sum dist/* > dist/checksums.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: test source code
        run: |
          python -m pytest
  deploy-staging:
    environment: staging
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: python-package
          path: dist/
      - name: verify promoted artifact
        run: |
          set -euo pipefail
          ls -lh dist/
          test -f dist/calculator-1.0.0-py3-none-any.whl
          test -f dist/calculator-1.0.0.tar.gz
          test -f dist/checksums.txt
          ls -lh dist/
          sha256sum -c dist/checksums.txt
      - name: Demonstrate Notice Annotation
        run: echo "::notice::Beginning deployment"
      - name: simulate staging deployment
        run: |
          echo "Simulating staging deployment..."
      - name: Demonstrate Error Annotation
        run: echo "::error::Deployment failed"
      - name: Deployment Summary
        run: |
          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: Staging" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: Success" >> "$GITHUB_STEP_SUMMARY"
      - name: Deployment Metadata
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Actor: $GITHUB_ACTOR"
          echo "Workflow: $GITHUB_WORKFLOW"
          echo "Run ID: $GITHUB_RUN_ID"
          echo "Run Attempt: $GITHUB_RUN_ATTEMPT"
      - name: Write Deployment Log
        run: |
          echo "Staging deployment completed successfully." > deployment.log
          echo "Commit: $GITHUB_SHA" >> deployment.log
          echo "Actor: $GITHUB_ACTOR" >> deployment.log
          echo "Workflow: $GITHUB_WORKFLOW" >> deployment.log
          echo "Run ID: $GITHUB_RUN_ID" >> deployment.log
          echo "Run Attempt: $GITHUB_RUN_ATTEMPT" >> deployment.log

      - name: Upload Deployment Evidence
        uses: actions/upload-artifact@v7
        with:
          name: deployment-metadata
          path: deployment.log
          if-no-files-found: error




  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: python-package
          path: dist/
      - name: verify promoted artifact
        run: |
          set -euo pipefail
          test -f dist/calculator-1.0.0-py3-none-any.whl
          test -f dist/calculator-1.0.0.tar.gz
          test -f dist/checksums.txt
          ls -lh dist/
          sha256sum -c dist/checksums.txt
      - name: simulate production deployment
        run: |
          echo "Simulating production deployment..."