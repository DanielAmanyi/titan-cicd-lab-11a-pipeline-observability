name: pipeline observability
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: install build dependencies
        run: |
          pip install build
      - name: Build Package
        run: |
          echo "Starting package build..."
          python -m build
          echo "Package build completed."

      - name: Verify sha256 checksum
        run: |
          sha256sum dist/* > dist/checksums.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: test source code
        run: |
          python -m pytest
  deploy-staging:
    environment: staging
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: python-package
          path: dist/
      - name: verify promoted artifact
        run: |
          set -euo pipefail
          ls -lh dist/
          test -f dist/calculator-1.0.0-py3-none-any.whl
          test -f dist/calculator-1.0.0.tar.gz
          test -f dist/checksums.txt
          ls -lh dist/
          sha256sum -c dist/checksums.txt
      - name: Demonstrate Notice Annotation
        run: echo "::notice::Beginning deployment"
      - name: simulate staging deployment
        run: |
          echo "Simulating staging deployment..."

  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: python-package
          path: dist/
      - name: verify promoted artifact
        run: |
          set -euo pipefail
          test -f dist/calculator-1.0.0-py3-none-any.whl
          test -f dist/calculator-1.0.0.tar.gz
          test -f dist/checksums.txt
          ls -lh dist/
          sha256sum -c dist/checksums.txt
      - name: simulate production deployment
        run: |
          echo "Simulating production deployment..."